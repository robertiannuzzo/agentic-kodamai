name: recruitment-platform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chezscheme libgmp-dev build-essential curl python3
      - name: Build pinned Idris compiler in project
        run: make bootstrap
      - name: Install web dependencies
        run: npm ci
      - name: Core and Slice 1 verification
        run: make test
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser journeys
        run: npx playwright test
